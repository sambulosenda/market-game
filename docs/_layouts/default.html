<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} · {{ site.title }}</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #fbe3b5; color: #4a2f1b; font: 17px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
      nav { font-size: 15px; margin-bottom: 24px; }
      nav a { margin-right: 16px; }
      a { color: #b4421f; }
      h1 { font-size: 30px; line-height: 1.2; margin: 0 0 4px; }
      h2 { font-size: 20px; margin: 32px 0 8px; }
      table { border-collapse: collapse; width: 100%; font-size: 15px; }
      th, td { text-align: left; vertical-align: top; padding: 8px 10px 8px 0; border-bottom: 1px solid #e6c88f; }
      .date { color: #7a5a3c; font-size: 15px; margin-bottom: 24px; }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="{{ '/' | relative_url }}">Market Street</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
      </nav>
      <h1>{{ page.title }}</h1>
      {% if page.dated %}<p class="date">Effective {{ site.effective_date }}</p>{% endif %}
      {{ content }}
    </main>
  </body>
</html>
